name: Build WebDriverAgent IPA
on:
  push:
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout WDA
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: master

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build (unsigned)
        run: |
          set -e
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tail -50

      - name: Package IPA
        run: |
          set -e
          APP=build/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app
          ls -la "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry WebDriverAgentRunner.ipa Payload
          ls -la WebDriverAgentRunner.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-ipa
          path: WebDriverAgentRunner.ipa
          retention-days: 7
